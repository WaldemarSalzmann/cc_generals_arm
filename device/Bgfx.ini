; bgfx render settings for the ODROID-N2+ (Mali-G52, Panfrost OpenGL 3.1).
; The GPU is the bottleneck: no MSAA, no scene framebuffer / post effects, no shadow map.
GameData
  BgfxRenderer = gl
  BgfxMSAA = 1
  BgfxNoSceneFramebuffer = Yes        ; render straight to the backbuffer (disables all post effects)
  BgfxPostProcessing = No
  BgfxShadowMaps = No
  BgfxStencilShadows = No
  BgfxSoftParticles = No
  BgfxSSAO = No
  BgfxBloom = No
  BgfxHdr = No
End
